services:
  bookf:
    image: ubuntu:24.04

    # -----------------------------------------------------------------------
    # LIBRARY PATH
    # Set BOOK_ROOT to the path inside the container where your library is
    # mounted. The default matches the volume mount below (/books).
    # To override without editing this file:
    #   BOOK_ROOT=/books docker compose up
    # -----------------------------------------------------------------------
    environment:
      - BOOK_ROOT=${BOOK_ROOT:-/books}

    # -----------------------------------------------------------------------
    # VOLUMES
    # Left side  = path on the host (edit this to match your library).
    # Right side = path inside the container (keep as /books unless you also
    #              change BOOK_ROOT above).
    #
    # Examples:
    #   /mnt/synology_komga:/books   (NFS mount)
    #   /srv/ebooks:/books           (local directory)
    #   /home/user/Books:/books      (home directory)
    # -----------------------------------------------------------------------
    volumes:
      # Mount the cloned repo so no image rebuild is needed when bookf.sh changes.
      - .:/bookf
      # Mount your ebook library (edit the host path on the left).
      - /mnt/synology_komga:/books

    # Calibre is installed automatically before the script runs.
    # No manual installation on the host is required.
    entrypoint: >
      bash -c "
        apt-get update -qq &&
        DEBIAN_FRONTEND=noninteractive apt-get install -y -qq calibre python3 &&
        chmod +x /bookf/bookf.sh &&
        /bookf/bookf.sh --dir \"$$BOOK_ROOT\"
      "

    # The container exits when the script finishes.
    restart: "no"

# -----------------------------------------------------------------------
# USAGE
# -----------------------------------------------------------------------
#
#   1. Edit the host-side volume path above to point to your ebook library.
#
#   2. Run (Calibre installs automatically on first start):
#        docker compose up
#
#   3. Monitor progress in another terminal:
#        docker compose logs -f
#
#   4. Pass extra flags (e.g. --dry-run or --force) by overriding the
#      entrypoint directly:
#        docker compose run --rm bookf bash -c "
#          apt-get update -qq &&
#          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq calibre python3 &&
#          /bookf/bookf.sh --dry-run --dir /books"
#
#   5. After the run, trigger a Komga library scan:
#        curl -u admin:PASSWORD -X POST \
#          http://YOUR_KOMGA_HOST:8342/api/v1/libraries/LIBRARY_ID/scan
#
# -----------------------------------------------------------------------
# PERFORMANCE TIP
# -----------------------------------------------------------------------
# Installing Calibre on every container start takes ~30 seconds.
# Build a reusable image once to skip that step on subsequent runs:
#
#   FROM ubuntu:24.04
#   RUN apt-get update && \
#       DEBIAN_FRONTEND=noninteractive apt-get install -y calibre python3 && \
#       rm -rf /var/lib/apt/lists/*
#
# Save as Dockerfile, run `docker build -t bookf-runner .`, then replace
# `image: ubuntu:24.04` with `image: bookf-runner` above and remove the
# apt-get install lines from the entrypoint.
# -----------------------------------------------------------------------
